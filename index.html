<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picklist</title><style>body{font-family:system-ui,Arial,sans-serif;background:#f5f6f8;color:#20242a;margin:0;padding:16px;max-width:700px;margin-inline:auto}header{position:sticky;top:0;background:#f5f6f8;padding:8px 0 14px;z-index:1}h1{margin:0 0 5px;font-size:27px}.sub{color:#59616c;margin-bottom:10px}button{border:1px solid #bcc4ce;background:white;padding:10px 14px;border-radius:10px;font-size:15px}.book{background:white;border:1px solid #d8dce2;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 1px 3px #0001}.top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.box{font-size:26px;background:#e8edf3;padding:6px 12px;border-radius:9px}.channel{font-size:12px;color:#58616d}label{margin-left:auto;font-size:15px;white-space:nowrap}input{width:22px;height:22px;vertical-align:middle;accent-color:#218653}.title{font-size:17px;font-weight:600;line-height:1.35;margin:13px 0 8px}.sku{font-size:12px;color:#626c79;overflow-wrap:anywhere}.book.done{opacity:.48}.book.done .title{text-decoration:line-through}.book.hidden{display:none}</style></head><body><header><h1>Picklist</h1><div class="sub" id="count">0 of 2 collected</div><button id="filter" type="button">Show uncollected only</button></header><main><article class="book" data-key="251214REE017986|E017|2">

</main><script>(function(){const cards=[...document.querySelectorAll('.book')],key='picklist:' + '15:251214REE0179864:E01785:Reformers in the Wings (Second Edition): From Geiler von Kaysersberg to Theodore Beza|16:250627MMY09054034:Y09084:The Igbo and their neighbours: Inter-group relations in southeastern Nigeria to 1953|';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let hide=false;function update(){let total=0;cards.forEach(c=>{const on=c.querySelector('input').checked;c.classList.toggle('done',on);c.classList.toggle('hidden',hide&&on);if(on)total++});document.getElementById('count').textContent=total+' of '+cards.length+' collected';try{const state={};cards.forEach(c=>state[c.dataset.key]=c.querySelector('input').checked);localStorage.setItem(key,JSON.stringify(state))}catch(e){}}cards.forEach(c=>{const t=c.querySelector('input');t.checked=!!saved[c.dataset.key];t.addEventListener('change',update)});document.getElementById('filter').addEventListener('click',function(){hide=!hide;this.textContent=hide?'Show all books':'Show uncollected only';update()});update()})();</script></body></html>
